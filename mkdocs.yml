site_name: honest-backtest
site_description: An event-driven backtester built to demonstrate why backtests lie.
site_url: https://rohankraghu.github.io/honest-backtest/
repo_url: https://github.com/rohanKraghu/honest-backtest
repo_name: rohanKraghu/honest-backtest
edit_uri: edit/main/docs/
copyright: MIT License

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Auditing a strategy: guides/audit.md
      - Cross-validation paths: guides/cross-validation.md
      - Settings files and JSON: guides/config-and-json.md
      - Writing a strategy: guides/strategies.md
      - Costs, liquidity and carry: guides/costs.md
      - Paper trading: guides/paper-trading.md
      - Faster sweeps: guides/speed.md
  - Reference:
      - Command line: reference/cli.md
      - Python API: reference/api.md
  - Changelog: changelog.md

hooks:
  - docs/hooks/cli_help.py

exclude_docs: |
  hooks/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.snippets:
      check_paths: true

watch:
  - src
